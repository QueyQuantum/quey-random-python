[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quey-random"
version = "1.0.3"
description = "Python SDK for Quey — verifiable randomness from a physical entropy source. NIST-validated, Ed25519-signed draws."
readme = "README.md"
requires-python = ">=3.7"
license = { file = "LICENSE" }
authors = [
    { name = "Aaron Loeb", email = "contact@queyquantum.io" }
]
keywords = [
    "randomness",
    "verifiable-randomness",
    "physical-entropy",
    "trng",
    "ed25519",
    "nist",
    "rejection-sampling",
    "provable-fairness",
    "cryptography",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.25.0",
]

[project.optional-dependencies]
numpy = ["numpy>=1.20.0"]
benchmarks = ["numpy>=1.20.0", "matplotlib>=3.3.0", "randcrack>=0.1.0"]

[project.urls]
Homepage = "https://queyquantum.io"
Documentation = "https://queyquantum.io/documentation"
Repository = "https://github.com/QueyQuantum/quey-random-python"
"Verify a Draw" = "https://queyquantum.io/verify/89421ffc-6af3-427e-8123-fa6c799cc166"
"NIST Validation" = "https://queyquantum.io/stats"

[tool.setuptools.packages.find]
include = ["quey_random*"]
exclude = ["benchmarks*"]
